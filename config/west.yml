manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    # support nice_oled and nice_epaper
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: urob
      revision: v0.2.1
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
    - name: zmk-auto-layer
      remote: urob
    - name: zmk-tri-state
      remote: urob
    - name: zmk-leader-key
      remote: urob
    # support nice_oled and nice_epaper
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
